<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carreras</title>

    <link rel="stylesheet" href="css/carreras.css">
</head>

<body>

<header>

    <h1>Sistema de Gestión de Egresados</h1>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="gestion-egresados.html">Egresados</a></li>
            <li><a href="login.html">Cerrar Sesión</a></li>
        </ul>
    </nav>

</header>

<main>

<section class="contenedor">

<article>

<h2>Registro de Carreras</h2>

<div id="mensaje"></div>

<form id="formCarrera">

<label for="codigo">Código de la Carrera</label>
<input type="text" id="codigo">

<label for="nombre">Nombre de la Carrera</label>
<input type="text" id="nombre">

<label for="escuela">Escuela Académica</label>
<input type="text" id="escuela">

<label for="grado">Grado Académico</label>

<select id="grado">
    <option value="">Seleccione...</option>
    <option>Técnico</option>
    <option>Bachillerato</option>
    <option>Licenciatura</option>
    <option>Maestría</option>
</select>

<label for="descripcion">Descripción</label>

<textarea id="descripcion" rows="5"></textarea>

<br><br>

<button type="submit">
    Guardar Carrera
</button>

</form>

<hr>

<h2>Lista de Carreras</h2>

<table id="tablaCarreras">

<thead>

<tr>

<th>Código</th>
<th>Nombre</th>
<th>Escuela</th>
<th>Grado</th>
<th>Descripción</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="listaCarreras">

</tbody>

</table>

</article>

</section>

</main>

<footer>

<p>&copy; 2026 Universidad CENFOTEC</p>

</footer>

<script src="js/carreras.js"></script>

</body>

</html>
