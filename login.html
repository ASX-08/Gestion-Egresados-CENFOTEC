<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <h1>Sistema de Gestión de Egresados</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="login-container">

            <img src="assets/img/logo.png" alt="Logo CENFOTEC" class="logo-login">

            <h2>Inicio de Sesión</h2>

            <p class="bienvenida">
                Bienvenido al Sistema de Gestión de Egresados.
            </p>

            <form onsubmit="return iniciarSesion()">

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ingrese su correo">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña">

                <button type="submit">Iniciar Sesión</button>

            </form>

            <p class="olvide">
                ¿Olvidó su contraseña?
            </p>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Universidad CENFOTEC</p>
    </footer>

    <script src="js/login.js"></script>

</body>

</html>
